<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leonida Platinum · GTA VI Trophy Guide</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="stages.js"></script>
  <script defer src="tracker.js"></script>
  <script defer src="roadmap.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <header class="hero">
    <div class="identity">
      <p class="eyebrow">Grand Theft Auto VI / PlayStation 5</p>
      <h1>Leonida <em>Platinum</em></h1>
      <p class="subtitle">Offline trophy guide &amp; checklist</p>
    </div>
    <section class="progress-card" aria-label="Trophy progress">
      <p class="eyebrow">Your progress</p>
      <div class="progress-line"><strong id="progress-count">0 / 55</strong><span id="percent">0%</span></div>
      <progress id="progress" max="55" value="0" aria-label="Trophies earned"></progress>
      <div id="grades" class="grade-totals"></div>
    </section>
  </header>
  <main>
    <nav class="views" aria-label="Guide views">
      <button type="button" id="checklist-view" aria-pressed="true">Checklist</button>
      <button type="button" id="roadmap-view" aria-pressed="false">Roadmap</button>
    </nav>
    <section id="checklist" aria-labelledby="list-title">
      <div class="toolbar">
        <div class="tools">
          <label class="search"><span>Search trophies</span><input id="search" type="search" placeholder="Name, description, or grade"></label>
          <label class="switch"><input type="checkbox" id="remaining"> Remaining only</label>
          <label class="switch"><input type="checkbox" id="spoiler"> Hide story spoilers</label>
          <div class="backup">
            <button type="button" id="export">Export</button>
            <button type="button" id="import">Import</button>
            <input type="file" id="backup-file" accept=".json,application/json" hidden>
          </div>
        </div>
        <div class="chips" id="kinds" role="group" aria-label="Filter by kind">
          <button data-kind="all" aria-pressed="true">All</button>
          <button data-kind="story" aria-pressed="false">Story</button>
          <button data-kind="missable" aria-pressed="false">Missable</button>
          <button data-kind="collectibles" aria-pressed="false">Collectibles</button>
          <button data-kind="activities" aria-pressed="false">Activities</button>
          <button data-kind="online" aria-pressed="false">Online</button>
          <button type="button" id="reset-filters">Reset filters</button>
        </div>
      </div>
      <p id="notice" role="status"></p>
      <div class="workspace">
        <div>
          <div class="list-heading"><h2 id="list-title">Trophy checklist</h2><span id="result-count" aria-live="polite">Loading…</span></div>
          <ul id="trophies" class="trophy-list" aria-label="Trophies"></ul>
        </div>
        <aside id="detail" class="detail" aria-labelledby="detail-title"></aside>
      </div>
    </section>
    <section id="roadmap" aria-labelledby="roadmap-title" hidden></section>
  </main>
</body>
</html>
